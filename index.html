<!DOCTYPE html>

<html>

<head>

  <title>PIXY BIRD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

</head>

<body>
  <canvas id="c" width="360" height="640"></canvas>
 
  <div id="score">0</div>
 
  <button id="mute">SOUND ON</button>

  <div id="hint">CLICK OR PRESS SPACE</div>

  <div id="over" class="off">
    <h1>GAME OVER</h1>
    <p id="res"></p>
    <p>CLICK OR PRESS SPACE</p>
  </div>

<div id="intro">
  <h1>PIXY BIRD</h1>
  <div id="card">
    <div id="mr"></div>
    <div id="info">
      <h2>MR. PARROT></h2>
      <p>HE IS STUCK HERE</p>
      <p> HE WANTS OUT</p>
      <p>HELP HIM ESCAPE!</p>
      <p>CLICK M TO MUTE/UNMUTE</p>
    </div>
  </div>
<p class="go">CLICK OR PRESS SPACE </p>
</div>

  <script src="script.js"></script>

</body>

</html>
